# GitHub Pages への公開ワークフロー
#
# 注意（社内ルール）:
# - Pages を使うにはリポジトリが Public である必要がある。
# - API キーなどの認証情報を含めないよう注意すること（本作品は認証情報不要）。
#
# `configure-pages` の `enablement: true` は、Pages がまだ有効化されていない
# リポジトリに対して、ワークフロー自身が API 経由で有効化を試みる設定。
# これが通れば情シスへの依頼は不要になる。
# 組織側で Pages が制限されている場合は権限エラーになるので、
# そのときは Settings > Pages > Source = GitHub Actions を情シスに依頼する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages の有効化を先に済ませる。ここで失敗するならビルドしても無駄なので、
      # 時間のかかる install / build より前に置いている。
      - uses: actions/configure-pages@v5
        with:
          # Pages が未有効なら、このワークフロー自身が有効化を試みる
          enablement: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
